name: Verify DBL Campus

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DBL_SESSION_SECRET: testing-only-session-secret-ci-0123456789abcdef0123456789
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: bash tests/no-operational-data.sh
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install playwright==1.62.0 pypdf==6.21.4
      - run: playwright install --with-deps chromium
      - run: python tests/print_pwa.py
      - run: npm run build -- --mode native-test
        env:
          DBL_NATIVE_SERVER_URL: https://campus.example.net
      - run: python tests/native-origin.py

  docker-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: bash tests/docker-deployment.sh
