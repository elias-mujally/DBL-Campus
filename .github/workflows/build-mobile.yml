name: Build Android APK & iOS IPA (DBL Campus)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional GitHub Release tag (e.g. v1.0.0) to publish downloadable APK & IPA'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web bundle
        run: npm run build

      - name: Sync Capacitor Android project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Android Debug APK (Universal)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Build Signed Release APK (when keystore secrets are configured)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/release.keystore
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$(pwd)/app/release.keystore" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Prepare APK output file
        run: |
          mkdir -p artifacts/android
          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk artifacts/android/DBL-Campus-Android.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/android/DBL-Campus-Android.apk
          fi
          sha256sum artifacts/android/DBL-Campus-Android.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DBL-Campus-Android-APK
          path: artifacts/android/DBL-Campus-Android.apk
          if-no-files-found: error

  build-ios-ipa:
    name: Build iOS IPA
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web bundle
        run: npm run build

      - name: Sync Capacitor iOS project
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Install CocoaPods (if Podfile exists)
        working-directory: ios/App
        run: |
          if [ -f "Podfile" ]; then
            pod install
          fi

      - name: Build iOS App Bundle & Package Unsigned IPA (for AltStore / Sideloadly / Enterprise Resign)
        working-directory: ios/App
        run: |
          if [ -d "App.xcworkspace" ]; then
            xcodebuild -workspace App.xcworkspace \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              build
          else
            xcodebuild -project App.xcodeproj \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              build
          fi
          mkdir -p ../../artifacts/ios/Payload
          cp -R build/Build/Products/Release-iphoneos/App.app ../../artifacts/ios/Payload/App.app
          cd ../../artifacts/ios
          zip -r DBL-Campus-iOS.ipa Payload
          rm -rf Payload
          shasum -a 256 DBL-Campus-iOS.ipa

      - name: Upload iOS IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DBL-Campus-iOS-IPA
          path: artifacts/ios/DBL-Campus-iOS.ipa
          if-no-files-found: error

  publish-github-release:
    name: Publish APK & IPA to GitHub Release
    needs: [build-android-apk, build-ios-ipa]
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: DBL-Campus-Android-APK
          path: release-files

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: DBL-Campus-iOS-IPA
          path: release-files

      - name: Create GitHub Release with APK & IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: DBL Campus Mobile ${{ github.event.inputs.release_tag || github.ref_name }}
          body: |
            ## DBL Campus Mobile Builds (Android APK & iOS IPA)
            - **Android**: Download `DBL-Campus-Android.apk` and install directly on Android devices.
            - **iOS**: Download `DBL-Campus-iOS.ipa` and install via AltStore, Sideloadly, TrollStore, or sign with your Apple Developer account.
            - **Connecting to Cohort Server**: Open the app, tap **إعداد خادم الشبكة المحلية**, and enter your representative's LAN URL (e.g. `http://192.168.1.15:3000`).
          files: |
            release-files/DBL-Campus-Android.apk
            release-files/DBL-Campus-iOS.ipa
