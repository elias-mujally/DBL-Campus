name: Provision DBL Campus Compute Engine

on:
  push:
    branches: [cloud/gce-provision]
    paths: ['.github/workflows/gce-provision.yml', 'deploy/gce/provision-tunnel.sh', 'deploy/gce/probe-ipv6.sh']

permissions: {}

concurrency:
  group: dbl-campus-gce-provision
  cancel-in-progress: false

jobs:
  provision:
    if: github.repository_id == '1468017451'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Authenticate to the provisioner
        id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: dbl-campus
          workload_identity_provider: projects/${{ vars.DBL_GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/campus-provision/providers/github
          create_credentials_file: false
          export_environment_variables: false
      - name: Provision the approved VM
        env:
          CLOUDSDK_AUTH_ACCESS_TOKEN: ${{ steps.google.outputs.auth_token }}
        run: |
          test -n "$CLOUDSDK_AUTH_ACCESS_TOKEN"
          bash deploy/gce/provision-tunnel.sh --apply

  ipv6:
    needs: provision
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    permissions:
      id-token: write
    steps:
      - name: Authenticate for the startup checks
        id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: dbl-campus
          workload_identity_provider: projects/${{ vars.DBL_GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/campus-provision/providers/github
          create_credentials_file: false
          export_environment_variables: false
      - name: Check IPv6 from the guest
        env:
          CLOUDSDK_AUTH_ACCESS_TOKEN: ${{ steps.google.outputs.auth_token }}
        run: |
          test -n "$CLOUDSDK_AUTH_ACCESS_TOKEN"
          for attempt in {1..36}; do
            serial=$(gcloud compute instances get-serial-port-output dbl-campus \
              --project=dbl-campus --zone=us-central1-a --port=1 2>/dev/null) || serial=''
            if grep -qE '^DBL_CAMPUS_IPV6 (FAIL|READY)' <<< "$serial"; then
              grep -E '^DBL_CAMPUS_IPV6 (PASS (system|docker-registry|cloudflare-edge)|FAIL (system|docker-registry|cloudflare-edge)|READY)[[:space:]]*$' <<< "$serial"
              grep -qE '^DBL_CAMPUS_IPV6 READY[[:space:]]*$' <<< "$serial"
              exit $?
            fi
            sleep 5
          done
          echo '::error::Timed out waiting for guest IPv6 results.'
          exit 1
