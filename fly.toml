# Fly.io Deployment Configuration for DBL Campus (HTTPS + Persistent Volume)
# Before deploying:
#   1. Replace `app` with a unique app name.
#   2. Create persistent volume: `fly volumes create dbl_campus_data --size 3 --region fra`
#   3. Set secrets: `fly secrets set DBL_ADMIN_SETUP_CODE="..." DBL_SESSION_SECRET="..." APP_URL="https://<your-app>.fly.dev"`

app = "dbl-campus-cohort"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  TRUST_PROXY = "1"
  DBL_FORCE_HTTPS = "true"
  DBL_DATA_DIR = "/data"
  DBL_ALLOW_DEMO = "false"

[mounts]
  source = "dbl_campus_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
